<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>関係詞 並び替えクイズ（並び替えのみ）</title>
<style>
:root {
  --bg: #f4f6ff;
  --card: #ffffff;
  --primary: #3949ab;
  --primary-light: #e8eaf6;
  --accent: #7986cb;
  --text: #1a1a2e;
  --sub: #666;
  --border: #dde2ff;
  --correct: #2e7d32;
  --correct-bg: #e8f5e9;
  --wrong: #c62828;
  --wrong-bg: #ffebee;
  --blue: #185FA5;
  --red: #D85A30;
  --green: #1D9E75;
  --amber: #BA7517;
  --shadow: 0 2px 16px rgba(57,73,171,0.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Hiragino Kaku Gothic Pro','Noto Sans JP',Meiryo,sans-serif;min-height:100vh;padding:14px;color:var(--text)}
#app{max-width:560px;margin:0 auto}

/* START SCREEN */
.start-screen{padding:8px 0}
.start-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px;color:var(--primary)}
.start-sub{font-size:13px;color:var(--sub);text-align:center;margin-bottom:24px}
.count-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
.count-btn{padding:14px;border:2px solid var(--border);border-radius:12px;background:#fff;font-size:15px;font-weight:700;color:var(--primary);cursor:pointer;transition:all .15s;text-align:center}
.count-btn:hover,.count-btn.active{border-color:var(--primary);background:var(--primary-light)}
.count-btn:active{transform:scale(0.97)}
.start-btn{width:100%;padding:15px;background:linear-gradient(135deg,#5c6bc0,#3949ab);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:opacity .2s}
.start-btn:disabled{opacity:.35;cursor:default}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.unit-label{font-size:12px;color:var(--primary);font-weight:700;letter-spacing:1px}
.progress-label{font-size:12px;color:var(--sub);font-weight:600}
.progress-bar{height:5px;background:var(--border);border-radius:99px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .4s ease}

/* CARD */
.card{background:var(--card);border-radius:18px;padding:20px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.type-badge{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:700;border-radius:99px;padding:3px 11px;margin-bottom:12px;letter-spacing:.5px}
.japanese-box{margin-bottom:16px}
.japanese-label{font-size:11px;color:var(--sub);margin-bottom:4px}
.japanese{font-size:17px;font-weight:700;line-height:1.7}

/* ANSWER ZONE */
.answer-zone{min-height:52px;background:#f8f9ff;border:2px dashed #c5cae9;border-radius:11px;padding:9px 11px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;transition:border-color .2s}
.answer-zone.drag-over{border-color:var(--primary);background:#eef0fb}
.placeholder{color:#bbb;font-size:12px;user-select:none}

/* CHIPS */
.word-bank{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;min-height:44px}
.chip{padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;touch-action:none;transition:transform .1s,opacity .2s;border:none;outline:none;line-height:1}
.chip.bank{background:var(--primary-light);color:var(--primary)}
.chip.bank:active{transform:scale(.95)}
.chip.selected{background:var(--primary);color:#fff}
.chip.selected:active{transform:scale(.95)}
.chip.used{opacity:0;pointer-events:none;width:0;padding:0;margin:0;overflow:hidden}
.chip.dragging{opacity:.35;transform:scale(.93)}
.chip.correct-chip{background:#43a047!important;color:#fff!important}
.chip.wrong-chip{background:#e53935!important;color:#fff!important}

/* GHOST */
#ghost{position:fixed;pointer-events:none;z-index:9999;padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;background:var(--primary);color:#fff;box-shadow:0 6px 20px rgba(57,73,171,.35);transform:translate(-50%,-55%) scale(1.1);display:none;white-space:nowrap}

/* BUTTONS */
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#5c6bc0,#3949ab);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;margin-top:4px;transition:opacity .2s,transform .1s}
.btn:disabled{opacity:.35;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-clear{background:none;border:1.5px solid #c5cae9;color:var(--sub);width:100%;padding:9px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;margin-bottom:4px;transition:background .15s}
.btn-clear:active{background:var(--primary-light)}

/* RESULT */
.result-box{display:flex;align-items:flex-start;gap:11px;border-radius:11px;padding:12px 14px;margin-bottom:10px}
.result-icon{font-size:22px;flex-shrink:0;margin-top:1px}
.result-label{font-weight:700;font-size:15px;margin-bottom:3px}
.correct-ans{font-size:12px;color:#555;line-height:1.7;margin-top:3px}
.correct-label{font-weight:700;color:var(--wrong)}

/* STEPS */
.steps-wrap{margin-bottom:12px}
.step-block{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:7px;opacity:0;transition:opacity .35s}
.step-num{font-size:10px;font-weight:700;color:var(--primary);letter-spacing:.5px;margin-bottom:7px}
.step-ja{font-size:14px;font-weight:700;line-height:1.8;margin-bottom:8px;padding:8px 10px;background:#f8f9ff;border-radius:7px}
.step-body{font-size:13px;font-family:'Courier New',Courier,monospace;line-height:1.9}
.hl-blue{color:var(--blue);font-weight:600}
.hl-red{color:var(--red);font-weight:600}
.hl-green{color:var(--green);font-weight:600}
.hl-amber{color:var(--amber);font-weight:600}
.strike{text-decoration:line-through;opacity:.6}

/* EXPLANATION */
.exp-block{background:#fffde7;border:1px solid #ffe082;border-radius:10px;padding:11px 13px;margin-bottom:10px;opacity:0;transition:opacity .35s}
.exp-label{font-size:10px;font-weight:700;color:#f57f17;margin-bottom:6px;letter-spacing:.5px}
.exp-title{font-size:12px;font-weight:700;color:#555;margin-bottom:3px;margin-top:8px}
.exp-title:first-of-type{margin-top:0}
.exp-text{font-size:12px;color:#444;line-height:1.75}
.exp-code{font-family:'Courier New',monospace;font-size:12px;background:#fff8e1;padding:6px 9px;border-radius:6px;margin:4px 0;display:block;line-height:1.7}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-right:4px;vertical-align:middle}
.tag-blue{background:#e3f2fd;color:#1565c0}
.tag-red{background:#fce4ec;color:#880e4f}
.tag-green{background:#e8f5e9;color:#1b5e20}

/* SCORE CHIP */
.score-chip{text-align:center;margin-top:12px;color:var(--primary);font-weight:700;font-size:13px}

/* PHASE1 */
.ph1-label{font-size:10px;font-weight:700;color:var(--primary);letter-spacing:.5px;margin-bottom:8px}
.ph1-sent{background:#f8f9ff;border-radius:8px;padding:9px 11px;font-size:13px;font-family:'Courier New',monospace;line-height:1.8;margin-bottom:8px}
.ph1-q{font-size:12px;color:var(--sub);margin-bottom:8px;line-height:1.5}
.ph1-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.ph1-btn{padding:10px 8px;font-size:12px;font-weight:600;border-radius:9px;border:1.5px solid var(--border);background:#fff;color:var(--primary);cursor:pointer;transition:all .15s;line-height:1.3}
.ph1-btn:active{transform:scale(.97)}
.ph1-btn.ok{background:#e8f5e9;color:#2e7d32;border-color:#c8e6c9;pointer-events:none}
.ph1-btn.ng{background:#ffebee;color:#c62828;border-color:#ffcdd2;pointer-events:none}
.ph1-btn:disabled{pointer-events:none}
.ph1-fb{font-size:12px;line-height:1.6;padding:8px 10px;border-radius:7px;margin-top:4px;display:none}
.ph1-fb.ok{background:#e8f5e9;color:#2e7d32}
.ph1-fb.ng{background:#ffebee;color:#c62828}
.ph1-step{background:#fff;border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:8px}
.ph1-step.locked{opacity:.35;pointer-events:none}
.ph1-complete{background:#e8f5e9;border:1px solid #c8e6c9;border-radius:11px;padding:12px 14px;margin-bottom:8px;display:none}
.ph1-phase-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;margin-bottom:10px;display:inline-block}
.ph1-phase-badge.p1{background:#e8eaf6;color:#3c3489}
.ph1-phase-badge.p2{background:#e8f5e9;color:#1b5e20}

/* FINISH */
.finish{text-align:center;padding:16px 0}
.finish-icon{font-size:60px;margin-bottom:6px}
.finish-title{font-size:24px;font-weight:900;margin-bottom:18px}
.score-display{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-bottom:6px}
.score-big{font-size:68px;font-weight:900;color:var(--primary);line-height:1}
.score-of{font-size:24px;color:var(--sub)}
.score-msg{color:var(--sub);font-size:14px;margin-bottom:24px;line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<div id="ghost"></div>
<script>
// ===================== DATA =====================
const ALL_Q = [
{id:203,type:"who（主格・人）",
 ja:'<span class="hl-blue">私には</span><span class="hl-red">料理が得意な</span><span class="hl-blue">友人がいます。</span>',
 jaPlain:"私には料理が得意な友人がいます。",
 words:["I","have","a","friend","who","is","good","at","cooking"],
 answer:"I have a friend who is good at cooking.",
 steps:[
  {num:"STEP 1　2つの文に分解する",
   body:'文A: <span class="hl-blue">I have a friend.</span><br>文B: <span class="hl-red">The friend is good at cooking.</span>'},
  {num:"STEP 2　共通する名詞（先行詞）を見つける",
   body:'文A: I have a <u>friend</u>.<br>文B: <u>The friend</u> is good at cooking.<br>→ 共通！これが<strong>先行詞</strong>'},
  {num:"STEP 3　文Bの先行詞を関係代名詞に置き換える",
   body:'<span class="hl-red strike">The friend</span> → <span class="hl-green">who</span>（人が先行詞 → who）<br>文B: <span class="hl-green">who</span> is good at cooking.'},
  {num:"STEP 4　先行詞の直後にくっつける",
   body:'I have a <span class="hl-blue">friend</span> <span class="hl-green">who is good at cooking</span>.'},
 ],
 exp:{
  role:"主格",
  points:[
   {title:"なぜwhoを使うか",text:"先行詞がa friend（人）なので、関係代名詞はwhoまたはthatを使う。"},
   {title:"主格とは",text:"関係代名詞の後ろを見ると「is good at cooking」と動詞が直接続いている。これは節の中でwhoが主語の役割をしているから。主語が欠落した不完全な文が続く＝主格。"},
   {title:"主格は省略できない",text:"whoは節の主語なので省略不可。目的格と違い、必ず書く必要がある。",code:"× I have a friend is good at cooking.（whoが抜けると文が壊れる）"},
  ]
 }
},
{id:204,type:"who（主格・人）",
 ja:'<span class="hl-blue">男性は</span><span class="hl-red">私に道を尋ねた</span><span class="hl-blue">、香港の出身でした。</span>',
 jaPlain:"私に道を尋ねた男性は香港の出身でした。",
 words:["The","man","who","asked","me","the","way","was","from","Hong","Kong"],
 answer:"The man who asked me the way was from Hong Kong.",
 steps:[
  {num:"STEP 1　2つの文に分解する",
   body:'文A: <span class="hl-blue">The man was from Hong Kong.</span><br>文B: <span class="hl-red">The man asked me the way.</span>'},
  {num:"STEP 2　先行詞を見つける",
   body:'共通: <u>The man</u><br>文Bの先行詞 → <span class="hl-green">who</span> に置き換え'},
  {num:"STEP 3　先行詞の直後にくっつける",
   body:'The <span class="hl-blue">man</span> <span class="hl-green">who asked me the way</span> was from Hong Kong.'},
 ],
 exp:{
  role:"主格",
  points:[
   {title:"先行詞と関係詞節が離れることがある",text:"日本語では「私に道を尋ねた男性が主語」だが、英語は先に主語(The man)を出し、後から説明を加える語順になる。"},
   {title:"主語が長くなる構造",text:"The man [who asked me the way] was from Hong Kong.　→ [ ]内が主語を修飾し、wasが主節の動詞。関係詞節をカッコに入れて読むと構造が見やすい。",code:"The man [who asked me the way] was from Hong Kong.\n主語↑                               ↑主節の動詞"},
  ]
 }
},
{id:205,type:"who(m)/that（目的格・人）",
 ja:'<span class="hl-blue">作家は村上春樹です。</span><span class="hl-red">私が一番好きな</span><span class="hl-blue">。</span>',
 jaPlain:"私が一番好きな作家は村上春樹です。",
 words:["The","writer","that","I","like","best","is","Murakami","Haruki"],
 answer:"The writer that I like best is Murakami Haruki.",
 steps:[
  {num:"STEP 1　2つの文に分解する",
   body:'文A: <span class="hl-blue">The writer is Murakami Haruki.</span><br>文B: <span class="hl-red">I like the writer best.</span>'},
  {num:"STEP 2　文Bで先行詞はどこにあるか",
   body:'文B: I like <u>the writer</u> best.<br>→ likeの<strong>目的語</strong>の位置にある！ → <span class="tag tag-red">目的格</span>'},
  {num:"STEP 3　目的格の関係代名詞に置き換え",
   body:'<span class="hl-red strike">the writer</span> → <span class="hl-green">who(m)/that</span>（省略も可）<br>→ <span class="hl-green">who(m)/that</span> I like best'},
  {num:"STEP 4　完成",
   body:'The <span class="hl-blue">writer</span> <span class="hl-green">that</span> I like best is Murakami Haruki.'},
 ],
 exp:{
  role:"目的格",
  points:[
   {title:"目的格の見分け方",text:"関係代名詞の後ろをS+Vで読んでみる。「I like best」→ likeの目的語が抜けている。このように目的語が欠落した不完全な文が続く＝目的格。"},
   {title:"whoとwhomの違い",text:"正式にはwhomだが、現代英語では口語でwhoも使われる。入試ではthatが最も無難。"},
  ]
 }
},
{id:206,type:"whose（所有格・人）",
 ja:'<span class="hl-blue">私には友人がいます。</span><span class="hl-red">お兄さんがアニメーターの</span><span class="hl-blue">。</span>',
 jaPlain:"私にはお兄さんがアニメーターの友人がいます。",
 words:["I","have","a","friend","whose","brother","is","an","animator"],
 answer:"I have a friend whose brother is an animator.",
 steps:[
  {num:"STEP 1　2つの文に分解する",
   body:'文A: <span class="hl-blue">I have a friend.</span><br>文B: <span class="hl-red">The friend\'s brother is an animator.</span>'},
  {num:"STEP 2　所有関係を確認する",
   body:'文B: <span class="hl-red">The friend\'s</span> brother is an animator.<br>→「〜の」という所有関係 → <span class="tag tag-red">所有格</span> whose を使う'},
  {num:"STEP 3　〈whose＋名詞〉をセットで前に出す",
   body:'<span class="hl-red strike">The friend\'s</span> → <span class="hl-green">whose</span><br>→ <span class="hl-green">whose brother</span> is an animator.'},
  {num:"STEP 4　完成",
   body:'I have a <span class="hl-blue">friend</span> <span class="hl-green">whose brother is an animator</span>.'},
 ],
 exp:{
  role:"所有格",
  points:[
   {title:"whoseは〈whose＋名詞〉がセット",text:"whoseの後には必ず名詞が続く。「whose＋名詞」でひとかたまりとして節の先頭に出る。",code:"whose brother（友人の兄）← 'sをwhoseに替えたイメージ"},
   {title:"所有格は省略できない",text:"whoseは所有関係を示す唯一の形。省略すると意味が成立しないため、省略不可。"},
   {title:"後ろは完全な文",text:"whose brotherが主語の役割を果たすので、後ろは「is an animator」と完全な文が続く。"},
  ]
 }
},
{id:207,type:"which/that（主格・物）",
 ja:'<span class="hl-blue">これが</span><span class="hl-red">先週オープンした</span><span class="hl-blue">カフェです。</span>',
 jaPlain:"これが先週オープンしたカフェです。",
 words:["This","is","the","cafe","which","opened","last","week"],
 answer:"This is the cafe which opened last week.",
 steps:[
  {num:"STEP 1　2つの文に分解する",
   body:'文A: <span class="hl-blue">This is the cafe.</span><br>文B: <span class="hl-red">The cafe opened last week.</span>'},
  {num:"STEP 2　先行詞を確認する",
   body:'共通: <u>the cafe</u>（物）→ <span class="hl-green">which</span> または that を使う'},
  {num:"STEP 3　文Bの先行詞を関係代名詞に置き換える",
   body:'<span class="hl-red strike">The cafe</span> → <span class="hl-green">which</span><br>文B: <span class="hl-green">which</span> opened last week.（主語の位置 → <span class="tag tag-blue">主格</span>）'},
  {num:"STEP 4　完成",
   body:'This is the <span class="hl-blue">cafe</span> <span class="hl-green">which opened last week</span>.'},
 ],
 exp:{
  role:"主格",
  points:[
   {title:"物が先行詞のときはwhich/that",text:"先行詞がthe cafe（物・場所）なので、whoではなくwhichまたはthatを使う。"},
   {title:"主格の確認",text:"which opened last weekの「opened」は動詞。whichが節の主語になっている＝主格。後ろは主語が欠落した不完全な文。"},
   {title:"whichとthatの使い分け",text:"意味は同じ。ただし非制限用法（コンマあり）ではwhichのみ使える。制限用法ではどちらでも可。"},
   {title:"別解",text:"制限用法なのでthatも使える。",code:"This is the cafe that opened last week."},
  ]
 }
},
{id:208,type:"which/that（目的格・物）",
 ja:'<span class="hl-blue">これは</span><span class="hl-red">祖父母が私に送ってくれた</span><span class="hl-blue">贈り物です。</span>',
 jaPlain:"これは祖父母が私に送ってくれた贈り物です。",
 words:["This","is","the","gift","which","my","grandparents","sent","to","me"],
 answer:"This is the gift which my grandparents sent to me.",
 steps:[
  {num:"STEP 1　2つの文に分解する",
   body:'文A: <span class="hl-blue">This is the gift.</span><br>文B: <span class="hl-red">My grandparents sent the gift to me.</span>'},
  {num:"STEP 2　文Bで先行詞はどこか",
   body:'文B: My grandparents sent <u>the gift</u> to me.<br>→ sentの<strong>目的語</strong>の位置 → <span class="tag tag-red">目的格</span>'},
  {num:"STEP 3　文Bの先行詞を関係代名詞に置き換える",
   body:'<span class="hl-red strike">the gift</span> → <span class="hl-green">which</span>（物が先行詞 → which）<br>→ <span class="hl-green">which</span> my grandparents sent to me'},
  {num:"STEP 4　完成",
   body:'This is the <span class="hl-blue">gift</span> <span class="hl-green">which</span> my grandparents sent to me.'},
 ],
 exp:{
  role:"目的格",
  points:[
   {title:"目的格の見分け方",text:"関係代名詞の後ろを見ると「my grandparents sent ___ to me」と目的語が欠落した不完全な文。この___に先行詞が入るイメージ。"},
   {title:"目的格とは",text:"関係代名詞が節の中で動詞の目的語になっている形。主格（主語）と区別して意識しよう。"},
   {title:"to meの位置",text:"sentの後にtoが残っているのは、元々「sent the gift to me」のgiftがwhichになって前に出たから。前置詞toはそのまま残る。"},
   {title:"別解",text:"thatも使える。また目的格なので省略も可能だが、まず関係代名詞ありの形を身につけよう。",code:"This is the gift that my grandparents sent to me."},
  ]
 }
},
{id:209,type:"whose（所有格・物）",
 ja:'<span class="hl-blue">彼らは</span><span class="hl-red">その歴史が奈良時代にまでさかのぼる</span><span class="hl-blue">町に住んでいます。</span>',
 jaPlain:"彼らはその歴史が奈良時代にまでさかのぼる町に住んでいます。",

 answer:"They live in a town whose history goes back to the Nara era.",

  {num:"STEP 1　2つの文に分解する",
   body:'文A: <span class="hl-blue">They live in a town.</span><br>文B: <span class="hl-red">The town\'s history goes back to the Nara era.</span>'},
  {num:"STEP 2　所有関係を確認",
   body:'文B: <span class="hl-red">The town\'s</span> history → 「〜の」→ <span class="tag tag-red">所有格</span> whose<br>※先行詞が物（town）でもwhoseを使う'},
  {num:"STEP 3　〈whose＋名詞〉で置き換え",

let questions=[], curIdx=0, score=0, selectedCount=0, selectedOrder='random', selectedStart=203;
let answerOrder=[], pool=[], checked=false;
let dragData=null, touchData=null, touchId=null;
let results=[];
let phase=1;
let ph1State=[];

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

// ===================== INIT =====================
function startQuiz(){
  const pool=ALL_Q.filter(q=>q.id>=selectedStart);
  const base=selectedOrder==='order'
    ?[...pool].sort((a,b)=>a.id-b.id)
    :shuffle([...pool]);
  questions=base.slice(0,Math.min(selectedCount,base.length));
  curIdx=0;score=0;results=[];
  initQ();
}
function initQ(){
  const q=questions[curIdx];
  const sh=shuffle(q.words.map((w,i)=>({word:w,origIdx:i})));
  pool=sh.map((item,i)=>({...item,pi:i,used:false}));
  answerOrder=[];checked=false;
  phase=2;
  ph1State=[];
  render();
}

// ===================== RENDER =====================
function render(){
  const app=document.getElementById('app');
  if(curIdx>=questions.length){app.innerHTML=renderFinish();return;}
  const q=questions[curIdx];
  const pct=(curIdx/questions.length*100).toFixed(1);

  const header=`
    <div class="header"><span class="unit-label">関係代名詞</span><span class="progress-label">${curIdx+1} / ${questions.length}</span></div>

  const badgeRow=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">

    <span class="ph1-phase-badge ${phase===1?'p1':'p2'}">${phase===1?'フェーズ1　文を組み立てる':'フェーズ2　並び替え'}</span>
  </div>`;

  const jaBox=`<div class="japanese-box"><div class="japanese-label">日本語</div><div class="japanese">${q.jaPlain}</div></div>`;

  if(phase===1){
    const pd=PH1[q.id];
    const allCorrect=ph1State.every(s=>s.correct);

    const step1HTML=`<div class="ph1-step">
      <div class="ph1-label">STEP 1　2つの文に分解する</div>
      <div style="font-size:15px;font-weight:700;line-height:1.8;padding:8px 10px;background:#f8f9ff;border-radius:7px;margin-bottom:10px">${q.ja}</div>
      <div class="ph1-sent">${pd.sentA}</div>
      <div class="ph1-sent">${pd.sentB}</div>
    </div>`;

    // 確認STEPブロック群（STEP2以降）
    const confirmStepsHTML=pd.steps.map((s,si)=>{
      const st=ph1State[si];
      const locked=si>0&&!ph1State[si-1].correct;
      const optsHTML=`<div class="ph1-grid">${s.opts.map((o,oi)=>{
        let cls='ph1-btn';
        if(st.answered){cls+=o.c?' ok':' ng';}
        return `<button class="${cls}" onclick="ph1Answer(${si},${oi},${o.c},this)">${o.l}</button>`;
      }).join('')}</div>`;
      const fbHTML=`<div class="ph1-fb${st.answered?(st.correct?' ok':' ng'):''}" id="fb${si}" style="display:${st.answered?'block':'none'}">${st.correct?s.ok:(st.wrongTried?s.ng:'')}</div>`;
      return `<div class="ph1-step${locked?' locked':''}" id="ph1s${si}">
        <div class="ph1-label">STEP ${si+2}　確認しよう</div>
        <div class="ph1-q">${s.q}</div>
        ${optsHTML}${fbHTML}
      </div>`;
    }).join('');

    // 並び替えブロック（全STEP正解後に表示）
    let sortBlockHTML='';
    if(allCorrect){
      const ansWords=answerOrder.map(pi=>pool[pi]);
      const ansHTML=ansWords.length===0
        ?'<span class="placeholder">単語をタップして並べよう</span>'
        :ansWords.map((item,pos)=>`<span class="chip selected${checked?(isCorrect()?' correct-chip':' wrong-chip'):''}" data-area="answer" data-pos="${pos}" style="cursor:${checked?'default':'grab'}">${item.word}</span>`).join('');

          <div class="ph1-label" style="color:var(--correct)">STEP ${pd.steps.length+2}　並び替えて英文を完成させよう</div>
          <div class="answer-zone">${ansHTML}</div>
          <div class="word-bank">${bankHTML}</div>
          <div class="result-box" style="background:${ok?'var(--correct-bg)':'var(--wrong-bg)'}">
            <div class="result-icon">${ok?'⭕️':'❌'}</div>

        </div>`;
      }
    }

    app.innerHTML=`${header}<div class="card">${badgeRow}${jaBox}${step1HTML}${confirmStepsHTML}${sortBlockHTML}</div><div class="score-chip">スコア ${score}点</div>`;
    bindEvents();

      const sbs=document.querySelectorAll('.step-block');
      sbs.forEach((el,i)=>setTimeout(()=>el.style.opacity='1',i*180));
      const eb=document.getElementById('expBlock');
      if(eb)setTimeout(()=>eb.style.opacity='1',sbs.length*180+100);
    }
  } else {
    const ansWords=answerOrder.map(pi=>pool[pi]);
    const ansHTML=ansWords.length===0
      ?'<span class="placeholder">単語をタップして並べよう</span>'
      :ansWords.map((item,pos)=>`<span class="chip selected${checked?(isCorrect()?' correct-chip':' wrong-chip'):''}" data-area="answer" data-pos="${pos}" style="cursor:${checked?'default':'grab'}">${item.word}</span>`).join('');
    const bankHTML=pool.map((item,pi)=>`<span class="chip bank${item.used?' used':''}" data-area="bank" data-pi="${pi}" style="cursor:${item.used||checked?'default':'grab'}">${item.word}</span>`).join('');

    let actionHTML='';
    if(!checked){
      actionHTML=`<button class="btn-clear" id="clearBtn">リセット</button><button class="btn" id="checkBtn" ${answerOrder.length===0?'disabled':''}>答え合わせ</button>`;
    } else {
      const ok=isCorrect();
      const stepsHTML=q.steps.map((s,i)=>{
        const jaColorBlock=i===0&&q.ja?`<div class="step-ja">${q.ja}</div>`:'';
        return `<div class="step-block" id="sb${i}"><div class="step-num">${s.num}</div>${jaColorBlock}<div class="step-body">${s.body}</div></div>`;
      }).join('');
      const expHTML=buildExp(q.exp);
      const wrongAns=!ok?`<div class="correct-ans"><span class="correct-label">正解：</span>${q.answer}</div>`:'';
      const retryBtn2=!ok?`<button class="btn-clear" onclick="doRetry()" style="margin-top:8px;border-color:#c5cae9;color:var(--primary)">並べ直す</button>`:'';
      actionHTML=`
        <div class="result-box" style="background:${ok?'var(--correct-bg)':'var(--wrong-bg)'}">
          <div class="result-icon">${ok?'⭕️':'❌'}</div>
          <div><div class="result-label" style="color:${ok?'var(--correct)':'var(--wrong)'}">${ok?'正解！':'不正解'}</div>${wrongAns}</div>
        </div>
        ${retryBtn2}
        <div class="steps-wrap">${stepsHTML}</div>
        ${expHTML}
        <button class="btn" id="nextBtn">${curIdx+1>=questions.length?'結果を見る':'次の問題へ →'}</button>`;
    }
    app.innerHTML=`${header}<div class="card">${badgeRow}${jaBox}<div class="answer-zone" id="answerZone">${ansHTML}</div><div class="word-bank" id="wordBank">${bankHTML}</div>${actionHTML}</div><div class="score-chip">スコア ${score}点</div>`;
    bindEvents();
    if(checked){
      const sbs=document.querySelectorAll('.step-block');
      sbs.forEach((el,i)=>setTimeout(()=>el.style.opacity='1',i*180));
      const eb=document.getElementById('expBlock');
      if(eb)setTimeout(()=>eb.style.opacity='1',sbs.length*180+100);
    }
  }
}

function goPhase2(){phase=2;render();} // kept for safety but unused

function doRetry(){
  // チップを全部bank側に戻してcheckedをリセット（スコアは変えない）
  answerOrder.forEach(pi=>{pool[pi].used=false;});
  answerOrder=[];
  checked=false;
  // スコアを1戻す（不正解だったのでdoCheckで加算されていない → 戻す必要なし）
  render();
}

function ph1Answer(si,oi,correct,btn){
  const st=ph1State[si];
  if(st.answered)return;
  if(correct){
    st.answered=true;st.correct=true;
    render();
  } else {
    st.wrongTried=true;
    const fb=document.getElementById('fb'+si);
    if(fb){fb.style.display='block';fb.className='ph1-fb ng';fb.textContent=PH1[questions[curIdx].id].steps[si].ng;}
    if(btn){btn.classList.add('ng');btn.disabled=true;}
  }
}

function buildExp(exp){
  if(!exp)return'';
  const roleTag=`<span class="tag tag-blue">${exp.role}</span>`;
  const pts=exp.points.map(p=>`<div class="exp-title">${p.title}</div><div class="exp-text">${p.text}${p.code?`<code class="exp-code">${p.code}</code>`:''}</div>`).join('');
  return`<div class="exp-block" id="expBlock"><div class="exp-label">解説　${roleTag}</div>${pts}</div>`;
}

function isCorrect(){
  // 末尾ピリオドを除いて比較（コンマはwordsに含まれているのでそのまま）
  const normalize = s => s.trim().replace(/\.+$/, '').replace(/\s+/g,' ');
  const got = normalize(answerOrder.map(pi=>pool[pi].word).join(' '));
  const expected = normalize(questions[curIdx].answer);
  return got === expected;
}

// ===================== EVENTS =====================

// スワイプ検知用
let swipeStartX=0, swipeStartY=0, swipeChip=null, swipePos=-1;
// ドラッグカーソル挿入位置
let dragInsertPos=-1;

function bindEvents(){
  document.getElementById('checkBtn')?.addEventListener('click',doCheck);
  document.getElementById('clearBtn')?.addEventListener('click',doClear);
  document.getElementById('nextBtn')?.addEventListener('click',doNext);

  // Click: bankから追加
  document.querySelectorAll('.chip.bank:not(.used)').forEach(el=>{
    el.addEventListener('click',()=>{if(checked)return;const pi=+el.dataset.pi;pool[pi].used=true;answerOrder.push(pi);render();});
  });
  // Click: answerから削除
  document.querySelectorAll('.chip.selected').forEach(el=>{
    el.addEventListener('click',()=>{if(checked)return;const pos=+el.dataset.pos;const pi=answerOrder[pos];pool[pi].used=false;answerOrder.splice(pos,1);render();});
  });

  // Desktop drag
  document.querySelectorAll('.chip:not(.used)').forEach(el=>{
    el.setAttribute('draggable','true');
    el.addEventListener('dragstart',onDragStart);
    el.addEventListener('dragend',onDragEnd);
  });
  const az=document.getElementById('answerZone');
  const wb=document.getElementById('wordBank');
  az?.addEventListener('dragover',e=>{e.preventDefault();updateInsertCursor(az,e.clientX);});
  az?.addEventListener('dragleave',e=>{if(!az.contains(e.relatedTarget)){clearInsertCursor(az);az.classList.remove('drag-over');}});
  az?.addEventListener('drop',e=>{e.preventDefault();clearInsertCursor(az);az.classList.remove('drag-over');onDropAnswer(e);});
  wb?.addEventListener('dragover',e=>e.preventDefault());
  wb?.addEventListener('drop',e=>{e.preventDefault();onDropBank();});

  // Touch
  document.querySelectorAll('.chip:not(.used)').forEach(el=>{
    el.addEventListener('touchstart',onTouchStart,{passive:false});
  });
  document.addEventListener('touchmove',onTouchMove,{passive:false});
  document.addEventListener('touchend',onTouchEnd);
}

// ---- カーソル線表示 ----
function updateInsertCursor(az, clientX){
  az.classList.add('drag-over');
  const chips=[...az.querySelectorAll('.chip.selected:not(.dragging)')];
  // 既存カーソル削除
  az.querySelectorAll('.insert-cursor').forEach(el=>el.remove());
  let pos=chips.length;
  for(let i=0;i<chips.length;i++){
    const r=chips[i].getBoundingClientRect();
    if(clientX<r.left+r.width/2){pos=i;break;}
  }
  dragInsertPos=pos;
  // カーソル線挿入
  const cursor=document.createElement('div');
  cursor.className='insert-cursor';
  cursor.style.cssText='width:3px;height:32px;background:var(--primary);border-radius:2px;flex-shrink:0;align-self:center;';
  if(pos===0){
    az.insertBefore(cursor,az.firstChild);
  } else if(pos>=chips.length){
    az.appendChild(cursor);
  } else {
    az.insertBefore(cursor,chips[pos]);
  }
}
function clearInsertCursor(az){
  az?.querySelectorAll('.insert-cursor').forEach(el=>el.remove());
  dragInsertPos=-1;
}

// ---- Desktop drag ----
function onDragStart(e){
  const el=e.currentTarget;
  dragData={area:el.dataset.area,pi:el.dataset.pi!==undefined?+el.dataset.pi:null,pos:el.dataset.pos!==undefined?+el.dataset.pos:null};
  el.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  const az=document.getElementById('answerZone');
  clearInsertCursor(az);
  dragData=null;
}

function onDropAnswer(e){
  if(!dragData)return;
  const az=document.getElementById('answerZone');
  const chips=[...az.querySelectorAll('.chip.selected:not(.dragging)')];
  let dropPos=chips.length;
  for(let i=0;i<chips.length;i++){
    const r=chips[i].getBoundingClientRect();
    if(e.clientX<r.left+r.width/2){dropPos=i;break;}
  }
  if(dragData.area==='bank'){
    pool[dragData.pi].used=true;
    answerOrder.splice(dropPos,0,dragData.pi);
  } else if(dragData.area==='answer'){
    const fromPos=dragData.pos;
    const pi=answerOrder[fromPos];
    answerOrder.splice(fromPos,1);
    const ins=fromPos<dropPos?dropPos-1:dropPos;
    answerOrder.splice(Math.max(0,ins),0,pi);
  }
  render();
}

function onDropBank(){
  if(!dragData||dragData.area!=='answer')return;
  const pi=answerOrder[dragData.pos];
  pool[pi].used=false;answerOrder.splice(dragData.pos,1);render();
}

// ---- Touch drag + swipe ----
function onTouchStart(e){
  if(checked)return;
  const el=e.currentTarget;
  const t=e.touches[0];
  swipeStartX=t.clientX;swipeStartY=t.clientY;
  swipeChip=el;
  swipePos=el.dataset.pos!==undefined?+el.dataset.pos:-1;

  touchData={area:el.dataset.area,pi:el.dataset.pi!==undefined?+el.dataset.pi:null,pos:el.dataset.pos!==undefined?+el.dataset.pos:null,word:el.textContent.trim()};
  touchId=t.identifier;
  const g=document.getElementById('ghost');
  g.textContent=touchData.word;g.style.display='block';
  moveGhost(t.clientX,t.clientY);
  el.classList.add('dragging');
  e.preventDefault();
}

function onTouchMove(e){
  if(!touchData)return;
  const t=[...e.touches].find(t=>t.identifier===touchId);
  if(!t)return;
  moveGhost(t.clientX,t.clientY);
  const az=document.getElementById('answerZone');
  if(az){
    const r=az.getBoundingClientRect();
    const inZone=t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom;
    if(inZone){updateInsertCursor(az,t.clientX);}
    else{clearInsertCursor(az);az.classList.remove('drag-over');}
  }
  e.preventDefault();
}

function onTouchEnd(e){
  if(!touchData)return;
  document.getElementById('ghost').style.display='none';
  document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
  const t=e.changedTouches[0];
  const az=document.getElementById('answerZone');
  const wb=document.getElementById('wordBank');
  clearInsertCursor(az);

  // スワイプ判定（答えエリアの単語を左右に移動）
  const dx=t.clientX-swipeStartX;
  const dy=t.clientY-swipeStartY;
  const isSwipe=Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5;
  if(isSwipe && touchData.area==='answer' && swipePos>=0){
    const dir=dx>0?1:-1;
    const newPos=swipePos+dir;
    if(newPos>=0&&newPos<answerOrder.length){
      const pi=answerOrder[swipePos];
      answerOrder.splice(swipePos,1);
      answerOrder.splice(newPos,0,pi);
      touchData=null;touchId=null;swipeChip=null;
      az?.classList.remove('drag-over');
      render();return;
    }
  }

  let dropped=false;
  if(az){
    const r=az.getBoundingClientRect();
    if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom){
      // カーソル位置に挿入
      const chips=[...az.querySelectorAll('.chip.selected')];
      let dropPos=chips.length;
      for(let i=0;i<chips.length;i++){const r2=chips[i].getBoundingClientRect();if(t.clientX<r2.left+r2.width/2){dropPos=i;break;}}
      if(touchData.area==='bank'){
        pool[touchData.pi].used=true;
        answerOrder.splice(dropPos,0,touchData.pi);
        dropped=true;
      } else if(touchData.area==='answer'){
        const from=touchData.pos;const pi=answerOrder[from];
        answerOrder.splice(from,1);
        const ins=from<dropPos?dropPos-1:dropPos;
        answerOrder.splice(Math.max(0,ins),0,pi);
        dropped=true;
      }
    }
  }
  if(!dropped&&wb){
    const r=wb.getBoundingClientRect();
    if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom){
      if(touchData.area==='answer'){const pi=answerOrder[touchData.pos];pool[pi].used=false;answerOrder.splice(touchData.pos,1);dropped=true;}
    }
  }
  touchData=null;touchId=null;swipeChip=null;
  az?.classList.remove('drag-over');
  if(dropped)render();
}
function moveGhost(x,y){const g=document.getElementById('ghost');g.style.left=x+'px';g.style.top=y+'px';}

function doCheck(){
  checked=true;
  const ok=isCorrect();
  if(ok)score++;
  const q=questions[curIdx];
  const userAns=answerOrder.map(pi=>pool[pi].word).join(' ');
  results.push({id:q.id,type:q.type,jaPlain:q.jaPlain,answer:q.answer,userAnswer:userAns,correct:ok});
  render();
}
function doClear(){answerOrder.forEach(pi=>pool[pi].used=false);answerOrder=[];render();}
function doNext(){curIdx++;if(curIdx>=questions.length){render();return;}initQ();}

// ===================== FINISH =====================
function renderFinish(){
  const total=questions.length;
  const pct=Math.round(score/total*100);
  const msg=score===total?'全問正解！完璧です！🎊':pct>=80?'すばらしい！もう少しで満点！':pct>=60?'よくできました！苦手な種類を復習しよう':'もう一度チャレンジしよう！';

  const correctList=results.filter(r=>r.correct);
  const wrongList=results.filter(r=>!r.correct);

  const renderRow=(r,idx)=>`
    <div style="border:1px solid ${r.correct?'#c8e6c9':'#ffcdd2'};border-radius:10px;padding:10px 12px;margin-bottom:8px;background:${r.correct?'#f1f8e9':'#fff8f8'}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span style="font-size:16px">${r.correct?'⭕️':'❌'}</span>
        <span style="font-size:10px;font-weight:700;color:var(--sub);background:#f0f0f0;padding:2px 8px;border-radius:99px">No.${r.id}</span>
        <span style="font-size:10px;color:var(--sub)">${r.type}</span>
      </div>
      <div style="font-size:12px;color:#444;margin-bottom:3px">${r.jaPlain}</div>
      <div style="font-size:12px;font-family:'Courier New',monospace;color:${r.correct?'var(--correct)':'var(--wrong)'}">
        ${r.correct?r.answer:r.userAnswer}
      </div>
      ${!r.correct?`<div style="font-size:11px;color:#888;margin-top:3px;font-family:'Courier New',monospace">正解: ${r.answer}</div>`:''}
    </div>`;

  return`
    <div class="card">
      <div class="finish">
        <div class="finish-icon">🏆</div>
        <div class="finish-title">クイズ完了！</div>
        <div class="score-display"><span class="score-big">${score}</span><span class="score-of">/ ${total}</span></div>
        <div class="score-msg">${msg}</div>
      </div>

      ${wrongList.length>0?`
      <div style="margin-bottom:20px">
        <div style="font-size:13px;font-weight:700;color:var(--wrong);margin-bottom:10px;display:flex;align-items:center;gap:6px">
          <span>❌</span> 間違えた問題 (${wrongList.length}問)
        </div>
        ${wrongList.map(renderRow).join('')}
      </div>`:''}

      <div style="margin-bottom:20px">
        <div style="font-size:13px;font-weight:700;color:var(--correct);margin-bottom:10px;display:flex;align-items:center;gap:6px">
          <span>⭕️</span> 正解した問題 (${correctList.length}問)
        </div>
        ${correctList.length>0?correctList.map(renderRow).join(''):'<div style="font-size:13px;color:var(--sub);text-align:center;padding:12px">なし</div>'}
      </div>

      <button class="btn" onclick="renderStart()">問題数を選んでもう一度</button>
    </div>`;
}

// ===================== START SCREEN =====================
function renderStart(){
  selectedCount=0;selectedOrder='random';selectedStart=203;
  const counts=[5,10,15,20,25,30,35,38];
  const allIds=ALL_Q.map(q=>q.id);
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="card start-screen">
      <div class="start-title">関係代名詞　並び替えクイズ</div>
      <div style="font-size:11px;background:#e8f5e9;color:#2e7d32;font-weight:700;padding:4px 12px;border-radius:99px;display:inline-block;margin-bottom:8px">並び替えのみ</div>
      <div class="start-sub">203〜240番　全38問収録</div>
      <div style="font-size:13px;color:var(--sub);margin-bottom:8px;text-align:center">出題順を選んでください</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px">
        <button class="count-btn active" id="orderRandom" onclick="selectOrder('random')">🔀 ランダム</button>
        <button class="count-btn" id="orderOrder" onclick="selectOrder('order')">📋 番号順</button>
      </div>
      <div style="font-size:13px;color:var(--sub);margin-bottom:8px;text-align:center">開始番号を選んでください</div>
      <select id="startSelect" onchange="selectStart(+this.value)" style="width:100%;padding:11px 12px;font-size:14px;font-weight:600;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--primary);margin-bottom:18px;appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 12 12%22><path fill=%22%233949ab%22 d=%22M6 8L1 3h10z%22/></svg>');background-repeat:no-repeat;background-position:right 12px center">
        ${allIds.map(id=>`<option value="${id}">No.${id}〜</option>`).join('')}
      </select>
      <div style="font-size:13px;color:var(--sub);margin-bottom:8px;text-align:center">問題数を選んでください</div>
      <div class="count-grid">${counts.map(n=>`<button class="count-btn" data-n="${n}" onclick="selectCount(${n})">${n}問${n===38?'（全問）':''}</button>`).join('')}</div>
      <button class="start-btn" id="startBtn" disabled onclick="startQuiz()">スタート</button>
    </div>`;
}

function selectStart(id){
  selectedStart=id;
}

function selectOrder(order){
  selectedOrder=order;
  document.getElementById('orderRandom').classList.toggle('active',order==='random');
  document.getElementById('orderOrder').classList.toggle('active',order==='order');
}

function selectCount(n){
  selectedCount=n;
  document.querySelectorAll('.count-btn[data-n]').forEach(b=>b.classList.toggle('active',+b.dataset.n===n));
  document.getElementById('startBtn').disabled=false;
}

renderStart();
</script>
